<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Espaço reservado para uma captura de ecrã do PlussyCraft">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D2027"/>
      <stop offset="1" stop-color="#0D0E11"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <!-- blocos em pixel -->
  <g fill="#FFC61A">
    <rect x="1100" y="150" width="50" height="50" opacity=".9"/>
    <rect x="1150" y="200" width="50" height="50" opacity=".6"/>
    <rect x="1200" y="150" width="50" height="50" opacity=".35"/>
    <rect x="1050" y="250" width="50" height="50" opacity=".25"/>
  </g>
  <rect x="120" y="140" width="1360" height="720" rx="28" fill="none" stroke="#FFC61A" stroke-opacity=".55" stroke-width="4" stroke-dasharray="22 16"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="800" y="470" font-size="64" font-weight="800" fill="#FFFFFF">COLOCA AQUI A IMAGEM DO PLUSSYCRAFT</text>
    <text x="800" y="545" font-size="34" fill="#C5C9D3">Captura de ecrã, trailer ou arte do servidor</text>
    <text x="800" y="620" font-size="30" fill="#FFC61A">assets/images/hero-placeholder.svg  ·  sugestão: 1600 × 1000 px</text>
  </g>
</svg>
